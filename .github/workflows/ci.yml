name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inventory_demo
          POSTGRES_USER: inventory_app
          POSTGRES_PASSWORD: local-dev-only-change-this-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_app -d inventory_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://inventory_runtime:ci-runtime-password-change-me-123@127.0.0.1:55432/inventory_demo
      MIGRATION_DATABASE_URL: postgresql://inventory_app:local-dev-only-change-this-password@127.0.0.1:55432/inventory_demo
      SESSION_SECRET: ci-only-session-secret-change-me-1234567890
      SESSION_COOKIE_NAME: inventory_demo_session
      MFA_ENFORCED: "false"
      LOCAL_STORAGE_ROOT: ./var/uploads
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 58025
      MAIL_FROM: inventory@example.test
      INITIAL_ADMIN_EMAIL: admin@example.test
      NEXT_PUBLIC_APP_NAME: 多店库存管理系统
      NEXT_PUBLIC_DEMO_MODE: "true"
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
